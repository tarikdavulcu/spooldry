; SpoolDry firmware - PlatformIO project
; Board: Espressif ESP32-C6-DevKitC-1-N8   Framework: Arduino-ESP32 3.3.x (via pioarduino)
; Build:   pio run            Flash: pio run -t upload            Monitor: pio device monitor

[platformio]
src_dir = SpoolDry
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
; pioarduino ships Arduino-ESP32 3.x (required for ESP32-C6). "stable" tracks the latest release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = SpoolDry/partitions.csv
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
; ARDUINO_USB_CDC_ON_BOOT=0 keeps Serial on the USB-C port labelled "UART".
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DARDUINO_USB_CDC_ON_BOOT=0
